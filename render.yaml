services:
  - type: web
    name: diogo-studio-crm
    env: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn --chdir backend app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DIOGO_USER
        value: diogo
      - key: DIOGO_PASSWORD
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
